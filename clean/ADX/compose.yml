
services:
  adx:
    build:
      context: ..
      dockerfile: ADX/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../shared:/app/shared
    healthcheck:
      test:  ["CMD", "python", "-c",
      "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: 
      - "${ADX_PORT:-8002}:8000"
    networks:
      - ADXNetwork

networks:
  ADXNetwork:
    driver: bridge
