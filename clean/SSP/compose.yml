
configs:
  file: ../.env

services:
  db-ssp:
    image: postgres:16-alpine  # Alpine for smaller size, glibc not needed
    ports:
      - "${DB_SSP_PORT}:5432"  # Expose to host (optional, remove for production)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ADXNetwork
    restart: on-failure

  ssp:
    context: .
    dockerfile: Dockerfile
    ports: 
      - "${SSP_PORT}:8000"

# move pgadmin to root later
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"  # Maps container's port 80 to localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com"  # Login email
      PGADMIN_DEFAULT_PASSWORD: "admin"          # Login password
      PGADMIN_CONFIG_SERVER_MODE: 'False'        # Disable server mode for local use
      GUNICORN_ACCESS_LOGFILE: "/dev/null"
    networks:
      - ADXNetwork

networks:
  ADXNetwork:
    driver: bridge
