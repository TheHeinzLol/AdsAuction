
services:
  ssp:
    build:
      context: ./SSP
      dockerfile: Dockerfile
    ports:
      - "${SSP_PORT:-8001}:8000"
    volumes:
      - ./SSP/src:/app/src
    healthcheck:
      test:  ["CMD", "python", "-c",
      "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 86400s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - ADXNetwork
    restart: on-failure

  ows:
    build:
      context: ./OWS
      dockerfile: Dockerfile
    environment:
      - SSP_URL=http://ssp:8000
    volumes:
      - ./OWS/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c",
      "import urllib.request; urllib.request.urlopen('http://localhost:8041/metrics')"]
      interval: 86400s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      ssp:
        condition: service_healthy
    networks:
      - ADXNetwork
    restart: unless-stopped
  
  prometheus:
    image : prom/prometheus:v3.15.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
    restart: unless-stopped
    networks:
      - ADXNetwork
    depends_on:
      ows:
        condition: service_healthy
      ssp:
        condition: service_healthy
#      adx:
#        condition: service_healthy
#      dsp:
#        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3-slim
    container_name: grafana
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_LOG_LEVEL=warn
      - GF_PLUGINS_PREINSTALL_SYNC=prometheus
    restart: unless-stopped
    networks:
      - ADXNetwork
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  ADXNetwork:
    driver: bridge

