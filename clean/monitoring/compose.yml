
services:

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus_rtb
    labels:
      logging: "enabled"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - ADXNetwork

  loki:
    image: grafana/loki:latest
    container_name: loki_rtb
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - ADXNetwork

  tempo:
    image: grafana/tempo:main-9035640-2280-1
    container_name: tempo_rtb
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - ADXNetwork

  grafana:
    image: grafana/grafana:13.2.3-slim
    container_name: grafana_rtb
    labels:
      logging: "enabled"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admina
      - GF_LOG_LEVEL=warn
    restart: unless-stopped
    networks:
      - ADXNetwork
    depends_on:
      - prometheus
      - loki
      - tempo

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    networks:
      - ADXNetwork 
    depends_on: 
      - prometheus
      - loki
      - tempo


networks:
  ADXNetwork:
    driver: bridge

