services:
  grafana:
    image: grafana/grafana:13.2.3-slim
    container_name: lgtm_grafana
    labels:
      logging: "enabled"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admina
      - GF_LOG_LEVEL=warn
      - GF_PLUGINS_PREINSTALL_SYNC=prometheus
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: lgtm_loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: lgtm_prometheus
    labels:
      logging: "enabled"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

